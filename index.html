<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REZKA.UZ - Barcha kinolar va seriallar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background-color: #141416; color: #e1e1e6; }
  header { background-color: #1c1c1f; padding: 10px 15px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #29292e; sticky; top: 0; z-index: 100; }
  .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
  .logo { font-size: 20px; font-weight: 800; color: #00a8ff; text-decoration: none; }
  .logo span { color: #fff; }
  .search-box { display: flex; width: 100%; }
  .search-box input { width: 100%; padding: 8px 12px; background: #29292e; border: 1px solid #323238; border-radius: 6px 0 0 6px; color: #fff; outline: none; font-size: 14px; }
  .search-box button { padding: 8px 14px; background: #00a8ff; border: none; color: #fff; border-radius: 0 6px 6px 0; cursor: pointer; font-weight: 600; font-size: 13px; }
  .main-layout { display: flex; flex-direction: column; padding: 15px; gap: 15px; }
  aside { background: #1c1c1f; padding: 12px; border-radius: 8px; }
  .menu-title { font-size: 11px; color: #7c7c8a; text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
  .menu-list { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin-bottom: 12px; }
  .menu-list li a { display: block; padding: 5px 10px; background: #29292e; color: #c4c4cc; text-decoration: none; font-size: 12px; border-radius: 4px; }
  .menu-list li a:hover { background: #00a8ff; color: #fff; }
  .section-header { margin-bottom: 12px; border-bottom: 2px solid #29292e; padding-bottom: 6px; }
  .section-title { font-size: 16px; font-weight: 600; color: #fff; }
  .film-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .film-card { background: #1c1c1f; border-radius: 8px; overflow: hidden; text-decoration: none; color: inherit; display: block; }
  .poster-container { position: relative; width: 100%; height: 210px; background: #2a2a30; }
  .film-card img { width: 100%; height: 100%; object-fit: cover; }
  .badge-quality { position: absolute; top: 6px; left: 6px; background: #00a8ff; color: #fff; font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 3px; }
  .badge-voice { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.75); color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 3px; }
  .film-info { padding: 8px; }
  .film-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .film-meta { font-size: 10px; color: #7c7c8a; }

  @media (min-width: 768px) {
    header { flex-direction: row; justify-content: space-between; padding: 12px 4%; }
    .search-box { flex: 0 1 400px; }
    .main-layout { flex-direction: row; max-width: 1300px; margin: 20px auto; }
    aside { flex: 0 0 220px; }
    .menu-list { display: block; }
    .menu-list li a { background: transparent; padding: 8px 10px; font-size: 14px; }
    .film-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 15px; }
    .poster-container { height: 240px; }
  }
</style>

</head>
<body>

  <header>
    <a href="index.html" class="logo">REZKA<span>.UZ</span></a>
    <div class="search-box">
      <input type="text" placeholder="Kino yoki serial nomini kiriting...">
      <button>Qidiruv</button>
    </div>
  </header>

  <div class="main-layout">
    <aside>
      <div class="menu-title">Bo'limlar</div>
      <ul class="menu-list">
        <li><a href="index.html">Filmlar</a></li>
        <li><a href="#">Seriallar</a></li>
        <li><a href="#">Multfilmlar</a></li>
        <li><a href="#">Anime</a></li>
      </ul>
      <div class="menu-title">Janrlar</div>
      <ul class="menu-list">
        <li><a href="#">Jangari</a></li>
        <li><a href="#">Komediya</a></li>
        <li><a href="#">Fantastika</a></li>
        <li><a href="#">Dramatik</a></li>
      </ul>
    </aside>

    <main>
      <div class="section-header">
        <h1 class="section-title">So'nggi qo'shilganlar</h1>
      </div>

      <div class="film-grid">
        <a href="movie.html" class="film-card">
          <div class="poster-container">
            <span class="badge-quality">FHD 1080p</span>
            <span class="badge-voice">O'zbek tilida</span>
            <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=400&q=80" alt="Poster">
          </div>
          <div class="film-info">
            <div class="film-title">Qasoskorlar: Intihoy</div>
            <div class="film-meta">2026, Fantastika, Jangari</div>
          </div>
        </a>

        <a href="movie.html" class="film-card">
          <div class="poster-container">
            <span class="badge-quality">HD</span>
            <span class="badge-voice">1-Mavsum</span>
            <img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?auto=format&fit=crop&w=400&q=80" alt="Poster">
          </div>
          <div class="film-info">
            <div class="film-title">Koinot Sirlari (Serial)</div>
            <div class="film-meta">2026, Sarguzasht</div>
          </div>
        </a>
      </div>
    </main>
  </div>

</body>
</html>
